<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Expense · ExpenseTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/design-system.css" rel="stylesheet">
</head>
<body>
  <main class="ds-shell">
    <header class="ds-topbar">
      <a href="home.html" class="ds-icon-btn"><i class="bi bi-arrow-left fs-4"></i></a>
      <a href="home.html" class="ds-topbar-brand">ExpenseTracker</a>
      <span style="width:28px;"></span>
    </header>

    <div class="ds-content" style="padding-bottom: 7.5rem;">
      <h1 class="fs-3 fw-semibold mb-1">Add Expense</h1>
      <p class="ds-subtitle mb-4">Manual entry for un-scanned receipts.</p>

      <form>
        <section class="ds-card p-3 mb-3">
          <label for="expenseTitle" class="ds-label">Expense Title (Optional)</label>
          <input type="text" class="form-control ds-input" id="expenseTitle" placeholder="e.g. Weekly Groceries">
        </section>

        <section class="ds-card p-3 mb-3">
          <label for="amount" class="ds-label">Amount (Rp)</label>
          <input type="text" class="form-control ds-input" id="amount" value="Rp 0"
                 style="font-size:2rem;font-weight:700;padding:0.9rem 1.25rem;">
        </section>

        <section class="ds-card p-3 mb-3">
          <label for="date" class="ds-label">Date</label>
          <div class="ds-input-icon ds-input-icon-right">
            <i class="bi bi-calendar-week"></i>
            <input type="text" class="form-control ds-input" id="date" value="01/09/2026">
          </div>
        </section>

        <section class="ds-card p-3 mb-3">
          <label for="category" class="ds-label">Category</label>
          <div class="ds-input-icon ds-input-icon-right">
            <i class="bi bi-shapes"></i>
            <select class="form-select ds-input" id="category">
              <option selected>Select...</option>
              <option>Food &amp; Beverage</option>
              <option>Transportation</option>
              <option>Shopping</option>
              <option>Education</option>
            </select>
          </div>
        </section>

        <section class="ds-card p-3 mb-3">
          <div class="d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-ui-checks fs-4" style="color:var(--ds-brand-primary);"></i>
            <span class="fs-5 fw-semibold">Additional Details</span>
          </div>

          <span class="ds-label">Items</span>

          <div class="row g-2 mb-2">
            <div class="col-6">
              <span class="ds-label ds-label-muted" style="font-size:0.7rem;">Name</span>
              <input type="text" class="form-control ds-input" placeholder="Item name">
            </div>
            <div class="col-2">
              <span class="ds-label ds-label-muted" style="font-size:0.7rem;">Qty</span>
              <input type="number" class="form-control ds-input" value="1">
            </div>
            <div class="col-4">
              <span class="ds-label ds-label-muted" style="font-size:0.7rem;">Price</span>
              <input type="number" class="form-control ds-input" value="0">
            </div>
          </div>

          <!-- Saved items -->
          <div id="savedItems" class="d-grid gap-2 mb-3"></div>

          <button type="button" class="btn ds-btn-dashed w-100 d-flex align-items-center justify-content-center gap-2 mt-3"
                  data-bs-toggle="modal" data-bs-target="#addItemModal">
            <i class="bi bi-plus-lg"></i> Add Item
          </button>
        </section>
      </form>
    </div>

    <div class="ds-footer-cta">
      <button type="button" class="btn ds-btn-primary w-100">
        <i class="bi bi-save me-2"></i> Save Expense
      </button>
    </div>
  </main>

  <!-- Add Item modal -->
  <div class="modal fade ds-modal" id="addItemModal" tabindex="-1" aria-labelledby="addItemModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-2">
          <h5 class="modal-title fw-bold" id="addItemModalTitle">Add Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="addItemForm" novalidate>
          <div class="modal-body">
            <div class="mb-4">
              <label for="modalItemName" class="ds-label">Name</label>
              <input type="text" class="form-control ds-input" id="modalItemName" placeholder="Item name" required>
            </div>

            <div class="row g-3">
              <div class="col-4">
                <label for="modalItemQty" class="ds-label">Qty</label>
                <input type="number" class="form-control ds-input" id="modalItemQty" min="1" value="1" required>
              </div>
              <div class="col-8">
                <label for="modalItemPrice" class="ds-label">Price (Rp)</label>
                <input type="text" class="form-control ds-input" id="modalItemPrice" inputmode="numeric" value="Rp 0" required>
              </div>
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn ds-btn-neutral-tint" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn ds-btn-primary">Add Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      const formatRp = n => 'Rp ' + n.toLocaleString('id-ID');
      const parseRp = s => Number(String(s).replace(/[^\d]/g, '')) || 0;

      const modalEl = document.getElementById('addItemModal');
      const modal = new bootstrap.Modal(modalEl);
      const form = document.getElementById('addItemForm');
      const nameInput = document.getElementById('modalItemName');
      const qtyInput = document.getElementById('modalItemQty');
      const priceInput = document.getElementById('modalItemPrice');
      const savedItems = document.getElementById('savedItems');

      modalEl.addEventListener('show.bs.modal', () => {
        [nameInput, qtyInput, priceInput].forEach(el => el.classList.remove('is-invalid'));
      });

      nameInput.addEventListener('input', () => nameInput.classList.remove('is-invalid'));

      priceInput.addEventListener('input', () => {
        const digits = parseRp(priceInput.value);
        priceInput.value = digits ? formatRp(digits) : '';
        priceInput.classList.remove('is-invalid');
      });

      form.addEventListener('submit', event => {
        event.preventDefault();

        let valid = true;
        if (!nameInput.value.trim()) { nameInput.classList.add('is-invalid'); valid = false; }
        const qty = Number(qtyInput.value);
        if (!qty || qty < 1) { qtyInput.classList.add('is-invalid'); valid = false; }
        const price = parseRp(priceInput.value);
        if (price <= 0) { priceInput.classList.add('is-invalid'); valid = false; }
        if (!valid) return;

        const row = document.createElement('div');
        row.className = 'ds-transaction py-2';
        row.innerHTML =
          '<div class="flex-grow-1">' +
            '<div class="name"></div>' +
            '<div class="category">' + qty + ' × ' + formatRp(price) + '</div>' +
          '</div>' +
          '<span class="amount">' + formatRp(qty * price) + '</span>' +
          '<button type="button" class="ds-row-icon-btn remove-item" aria-label="Remove item"><i class="bi bi-x-lg"></i></button>';
        row.querySelector('.name').textContent = nameInput.value.trim();
        savedItems.appendChild(row);

        form.reset();
        modal.hide();
      });

      savedItems.addEventListener('click', event => {
        const removeBtn = event.target.closest('.remove-item');
        if (removeBtn) removeBtn.closest('.ds-transaction').remove();
      });
    })();
  </script>
</body>
</html>
