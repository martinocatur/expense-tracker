<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · ExpenseTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/design-system.css" rel="stylesheet">
</head>
<body>
  <main class="ds-shell">
    <header class="ds-topbar">
      <a href="profile_settings.html" class="ds-avatar ds-avatar-photo" aria-label="Profile"></a>
      <a href="home.html" class="ds-topbar-brand">ExpenseTracker</a>
      <a href="#" class="ds-icon-btn" aria-label="Notifications"><i class="bi bi-bell fs-4" style="color:var(--ds-brand-primary);"></i></a>
    </header>

    <div class="ds-content">
      <!-- Monthly budget hero (over-budget state) -->
      <section class="p-4" style="background:#D9DAE3;border-radius:var(--ds-radius-lg);box-shadow:var(--ds-shadow-card);">
        <div class="d-flex align-items-start justify-content-between">
          <h2 class="fs-3 mb-3">Monthly Budget</h2>
        </div>
        <div class="d-flex align-items-end justify-content-between mb-2">
          <span style="color:var(--ds-text-secondary);font-size:1rem;">Spent</span>
          <span class="ds-money" style="font-size:2.4rem;font-weight:800;line-height:1;">Rp 5.250.000</span>
        </div>
        <div class="ds-progress mb-3">
          <div class="ds-progress-bar ds-progress-bar-danger" style="width:100%;"></div>
        </div>
        <div class="d-flex align-items-center justify-content-between">
          <span style="color:var(--ds-text-secondary);">Limit: Rp 5.000.000</span>
          <span class="ds-badge-error">Overbudget</span>
        </div>
      </section>

      <!-- Category alerts -->
      <h2 class="ds-section-title mt-4 mb-3">Category Alerts</h2>
      <div class="ds-alert-banner">
        <span class="icon-circle"><i class="bi bi-exclamation-triangle-fill"></i></span>
        <div>
          <div class="fw-bold" style="color:var(--ds-error-deep);">Shopping</div>
          <div class="ds-caption" style="color:var(--ds-error-deep);">Overbudget</div>
        </div>
        <span class="ms-auto fw-bold fs-6" style="color:var(--ds-error);">Over Rp 200.000</span>
      </div>

      <!-- Quick actions -->
      <div class="d-grid gap-3 mt-4">
        <a href="scan_receipt_camera.html" class="ds-btn-action ds-btn-action-primary">
          <i class="bi bi-camera"></i>
          Scan Receipt
        </a>
        <a href="add_expense_manually.html" class="ds-btn-action ds-btn-action-secondary">
          <i class="bi bi-plus-circle"></i>
          Add Expense
        </a>
      </div>

      <!-- Recent activity -->
      <div class="d-flex align-items-center justify-content-between mt-5 mb-3">
        <h2 class="ds-section-title mb-0">Recent Activity</h2>
        <a href="main_expenses_page.html" class="fw-semibold text-decoration-none">See All</a>
      </div>

      <div class="d-grid gap-3">
        <div class="ds-transaction">
          <span class="ds-icon-avatar ds-icon-avatar-sm ds-tint-peach"><i class="bi bi-egg-fried"></i></span>
          <div>
            <div class="name">Starbucks</div>
            <div class="category">Food &amp; Beverage</div>
          </div>
          <span class="amount">-Rp 85.000</span>
        </div>
        <div class="ds-transaction">
          <span class="ds-icon-avatar ds-icon-avatar-sm ds-tint-gray"><i class="bi bi-car-front"></i></span>
          <div>
            <div class="name">GrabRide</div>
            <div class="category">Transport</div>
          </div>
          <span class="amount">-Rp 45.000</span>
        </div>
      </div>
    </div>

    <!-- Bottom navigation -->
    <nav class="ds-bottomnav">
      <div class="d-flex justify-content-around align-items-center">
        <a href="home.html" class="ds-nav-item">
          <span class="ds-nav-pill d-flex flex-column align-items-center px-3 py-2">
            <i class="bi bi-house-door-fill"></i>
            <span>Home</span>
          </span>
        </a>
        <a href="main_expenses_page.html" class="ds-nav-item">
          <i class="bi bi-wallet2"></i>
          <span>Expenses</span>
        </a>
        <a href="scan_receipt_camera.html" class="ds-nav-item">
          <i class="bi bi-camera"></i>
          <span>Scan</span>
        </a>
        <a href="settings.html" class="ds-nav-item">
          <i class="bi bi-gear"></i>
          <span>Settings</span>
        </a>
      </div>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
