<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Settings · ExpenseTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/design-system.css" rel="stylesheet">
</head>
<body>
  <main class="ds-shell">
    <header class="ds-topbar">
      <a href="settings.html" class="ds-icon-btn"><i class="bi bi-arrow-left fs-4"></i></a>
      <span class="ds-topbar-title fs-4">Budget Settings</span>
      <span style="width:28px;"></span>
    </header>

    <div class="ds-content" style="padding-bottom: 7.5rem;">
      <!-- Enable budgeting hero -->
      <section class="p-4" style="background:#D8DAE6;border-radius:var(--ds-radius-lg);box-shadow:var(--ds-shadow-card);">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <h2 class="fs-3 fw-bold mb-1">Enable Budgeting</h2>
            <p class="ds-row-value mb-0" style="font-size:1rem;">Track your spending limits</p>
          </div>
          <div class="form-check form-switch m-0">
            <input class="form-check-input ds-switch" type="checkbox" role="switch" id="enableBudgeting" checked>
          </div>
        </div>

        <hr style="border-color:rgba(17,24,39,0.1);opacity:1;">

        <label for="resetDate" class="ds-label" style="color:#374151;">Budget Reset Date</label>
        <div class="ds-input-icon ds-input-icon-right">
          <i class="bi bi-calendar2-week"></i>
          <input type="text" class="form-control ds-input" id="resetDate" value="15th of every month">
        </div>
      </section>

      <!-- Total monthly budget -->
      <label for="totalBudget" class="ds-label mt-4 mb-2" style="font-size:0.85rem;">Total Monthly Budget</label>
      <input type="text" class="form-control ds-input ds-input-amount" id="totalBudget" value="Rp 5.000.000"
             style="border-radius:var(--ds-radius-lg);">

      <div class="ds-card ds-row py-3 mt-3" style="border-radius:var(--ds-radius-lg);">
        <span class="fs-5" style="color:var(--ds-text-secondary);">Unallocated Budget:</span>
        <span class="ms-auto ds-money ds-money-success" id="unallocatedValue">Rp 1.500.000</span>
      </div>

      <!-- Category budgets -->
      <span class="ds-label mt-4 mb-2" style="font-size:0.85rem;">Category Budgets</span>

      <div class="d-grid gap-3" id="categoryBudgetList">
        <div class="ds-card ds-row py-3 budget-row" id="row-food" data-category="Food & Dining" data-amount="1500000" style="border-color:var(--ds-border-input);">
          <span class="ds-icon-avatar ds-tint-peach"><i class="bi bi-cup-hot"></i></span>
          <div>
            <div class="fw-bold fs-5 text-body">Food &amp; Dining</div>
            <div class="ds-row-value row-amount">Rp 1.500.000</div>
          </div>
          <div class="ms-auto d-flex gap-3">
            <button type="button" class="ds-row-icon-btn" data-bs-toggle="modal" data-bs-target="#categoryBudgetModal" data-mode="edit" aria-label="Edit Food & Dining budget"><i class="bi bi-pencil"></i></button>
            <button type="button" class="ds-row-icon-btn ds-row-icon-btn-danger delete-budget" aria-label="Delete Food & Dining budget"><i class="bi bi-trash"></i></button>
          </div>
        </div>

        <div class="ds-card ds-row py-3 budget-row" id="row-education" data-category="Education" data-amount="1000000" style="border-color:var(--ds-border-input);">
          <span class="ds-icon-avatar ds-tint-blue"><i class="bi bi-mortarboard"></i></span>
          <div>
            <div class="fw-bold fs-5 text-body">Education</div>
            <div class="ds-row-value row-amount">Rp 1.000.000</div>
          </div>
          <div class="ms-auto d-flex gap-3">
            <button type="button" class="ds-row-icon-btn" data-bs-toggle="modal" data-bs-target="#categoryBudgetModal" data-mode="edit" aria-label="Edit Education budget"><i class="bi bi-pencil"></i></button>
            <button type="button" class="ds-row-icon-btn ds-row-icon-btn-danger delete-budget" aria-label="Delete Education budget"><i class="bi bi-trash"></i></button>
          </div>
        </div>

        <div class="ds-card ds-row py-3 budget-row" id="row-transportation" data-category="Transportation" data-amount="1000000" style="border-color:var(--ds-border-input);">
          <span class="ds-icon-avatar ds-tint-gray"><i class="bi bi-car-front"></i></span>
          <div>
            <div class="fw-bold fs-5 text-body">Transportation</div>
            <div class="ds-row-value row-amount">Rp 1.000.000</div>
          </div>
          <div class="ms-auto d-flex gap-3">
            <button type="button" class="ds-row-icon-btn" data-bs-toggle="modal" data-bs-target="#categoryBudgetModal" data-mode="edit" aria-label="Edit Transportation budget"><i class="bi bi-pencil"></i></button>
            <button type="button" class="ds-row-icon-btn ds-row-icon-btn-danger delete-budget" aria-label="Delete Transportation budget"><i class="bi bi-trash"></i></button>
          </div>
        </div>

        <button type="button" class="btn ds-btn-dashed-muted w-100 d-flex align-items-center justify-content-center gap-2"
                data-bs-toggle="modal" data-bs-target="#categoryBudgetModal" data-mode="add">
          <i class="bi bi-plus-lg"></i> Add Category Budget
        </button>
      </div>
    </div>

    <div class="ds-footer-cta" style="background:transparent;">
      <button type="button" class="btn ds-btn-primary w-100">Save Changes</button>
    </div>
  </main>

  <!-- Add / Edit Category Budget modal -->
  <div class="modal fade ds-modal" id="categoryBudgetModal" tabindex="-1" aria-labelledby="categoryBudgetModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-2">
          <h5 class="modal-title fw-bold" id="categoryBudgetModalTitle">Add Category Budget</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="categoryBudgetForm" novalidate>
          <div class="modal-body">
            <div class="mb-4">
              <label for="modalCategory" class="ds-label">Category</label>
              <div class="ds-input-icon ds-input-icon-right">
                <i class="bi bi-shapes"></i>
                <select class="form-select ds-input" id="modalCategory" required>
                  <option value="" selected disabled>Select...</option>
                  <option>Food &amp; Dining</option>
                  <option>Transportation</option>
                  <option>Education</option>
                  <option>Shopping</option>
                  <option>Health</option>
                  <option>Entertainment</option>
                  <option>Bills</option>
                  <option>Family</option>
                  <option>Travel</option>
                </select>
              </div>
            </div>

            <div class="mb-2">
              <label for="modalAmount" class="ds-label">Amount (Rp)</label>
              <input type="text" class="form-control ds-input" id="modalAmount" inputmode="numeric" value="Rp 0" required>
            </div>

            <p class="ds-caption mb-0">Unallocated Budget: <span class="ds-money ds-money-success" id="modalUnallocated">Rp 1.500.000</span></p>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn ds-btn-neutral-tint" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn ds-btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      const formatRp = n => 'Rp ' + n.toLocaleString('id-ID');
      const parseRp = s => Number(String(s).replace(/[^\d]/g, '')) || 0;

      const unallocatedEl = document.getElementById('unallocatedValue');
      const modalUnallocatedEl = document.getElementById('modalUnallocated');
      const list = document.getElementById('categoryBudgetList');
      const form = document.getElementById('categoryBudgetForm');
      const titleEl = document.getElementById('categoryBudgetModalTitle');
      const select = document.getElementById('modalCategory');
      const amountInput = document.getElementById('modalAmount');
      const modalEl = document.getElementById('categoryBudgetModal');
      const modal = new bootstrap.Modal(modalEl);

      let unallocated = parseRp(unallocatedEl.textContent);
      let editingRow = null;

      const ICONS = {
        'Food & Dining':   ['bi-cup-hot', 'ds-tint-peach'],
        'Transportation':  ['bi-car-front', 'ds-tint-gray'],
        'Education':       ['bi-mortarboard', 'ds-tint-blue'],
        'Shopping':        ['bi-bag', 'ds-tint-peach'],
        'Health':          ['bi-heart-pulse', 'ds-tint-lavender'],
        'Entertainment':   ['bi-film', 'ds-tint-lavender'],
        'Bills':           ['bi-receipt', 'ds-tint-lavender'],
        'Family':          ['bi-people', 'ds-tint-lavender'],
        'Travel':          ['bi-airplane', 'ds-tint-lavender']
      };

      function syncUnallocated() {
        unallocatedEl.textContent = formatRp(unallocated);
        modalUnallocatedEl.textContent = formatRp(unallocated);
      }

      modalEl.addEventListener('show.bs.modal', event => {
        const trigger = event.relatedTarget;
        const mode = trigger ? (trigger.dataset.mode || 'add') : 'add';
        [select, amountInput].forEach(el => el.classList.remove('is-invalid'));

        editingRow = null;
        if (mode === 'edit') {
          titleEl.textContent = 'Edit Category Budget';
          select.value = trigger.dataset.category;
          select.disabled = true;
          amountInput.value = formatRp(Number(trigger.dataset.amount));
          editingRow = document.getElementById(trigger.closest('.budget-row').id);
        } else {
          titleEl.textContent = 'Add Category Budget';
          select.value = '';
          select.disabled = false;
          amountInput.value = 'Rp 0';
        }
        syncUnallocated();
      });

      amountInput.addEventListener('input', () => {
        const digits = parseRp(amountInput.value);
        amountInput.value = digits ? formatRp(digits) : '';
        amountInput.classList.remove('is-invalid');
      });

      select.addEventListener('change', () => select.classList.remove('is-invalid'));

      form.addEventListener('submit', event => {
        event.preventDefault();

        let valid = true;
        if (!select.value) { select.classList.add('is-invalid'); valid = false; }
        const amount = parseRp(amountInput.value);
        if (amount <= 0) { amountInput.classList.add('is-invalid'); valid = false; }
        if (!valid) return;

        const [icon, tint] = ICONS[select.value] || ['bi-shapes', 'ds-tint-lavender'];

        if (editingRow) {
          const previous = Number(editingRow.dataset.amount);
          unallocated += previous - amount;
          editingRow.dataset.amount = amount;
          editingRow.querySelector('.row-amount').textContent = formatRp(amount);
        } else {
          const row = document.createElement('div');
          row.className = 'ds-card ds-row py-3 budget-row';
          row.style.borderColor = 'var(--ds-border-input)';
          row.dataset.category = select.value;
          row.dataset.amount = amount;
          row.innerHTML =
            '<span class="ds-icon-avatar ' + tint + '"><i class="bi ' + icon + '"></i></span>' +
            '<div>' +
              '<div class="fw-bold fs-5 text-body"></div>' +
              '<div class="ds-row-value row-amount">' + formatRp(amount) + '</div>' +
            '</div>' +
            '<div class="ms-auto d-flex gap-3">' +
              '<button type="button" class="ds-row-icon-btn" data-bs-toggle="modal" data-bs-target="#categoryBudgetModal" data-mode="edit" aria-label="Edit ' + select.value + ' budget"><i class="bi bi-pencil"></i></button>' +
              '<button type="button" class="ds-row-icon-btn ds-row-icon-btn-danger delete-budget" aria-label="Delete ' + select.value + ' budget"><i class="bi bi-trash"></i></button>' +
            '</div>';
          row.querySelector('.fw-bold').textContent = select.value;
          editingRow = row;
          list.insertBefore(row, list.querySelector('.btn.ds-btn-dashed-muted'));
          unallocated -= amount;
        }

        syncUnallocated();
        modal.hide();
      });

      list.addEventListener('click', event => {
        const deleteBtn = event.target.closest('.delete-budget');
        if (!deleteBtn) return;
        const row = deleteBtn.closest('.budget-row');
        unallocated += Number(row.dataset.amount);
        syncUnallocated();
        row.remove();
      });
    })();
  </script>
</body>
</html>
