<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories · ExpenseTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/design-system.css" rel="stylesheet">
</head>
<body>
  <main class="ds-shell">
    <header class="ds-topbar">
      <a href="settings.html" class="ds-icon-btn"><i class="bi bi-arrow-left fs-4"></i></a>
      <span class="ds-topbar-title ds-topbar-title-accent fs-4">Categories</span>
      <span style="width:28px;"></span>
    </header>

    <div class="ds-content" style="padding-bottom: 7.5rem;">
      <!-- Search -->
      <div class="ds-input-icon mb-4">
        <i class="bi bi-search"></i>
        <input type="search" class="form-control ds-input" placeholder="Search categories..." aria-label="Search categories">
      </div>

      <!-- Category list -->
      <section class="ds-card">
        <div class="ds-row">
          <span class="ds-icon-avatar ds-tint-lavender"><i class="bi bi-shapes"></i></span>
          <span class="ds-row-title fs-4">General</span>
          <span class="ds-badge-system">System</span>
          <i class="bi bi-lock ms-auto fs-5" style="color:#9CA3AF;"></i>
        </div>
        <div class="ds-row">
          <span class="ds-icon-avatar ds-tint-lavender"><i class="bi bi-cup-hot"></i></span>
          <span class="ds-row-title fs-4">Food &amp; Beverage</span>
        </div>
        <div class="ds-row">
          <span class="ds-icon-avatar ds-tint-lavender"><i class="bi bi-car-front"></i></span>
          <span class="ds-row-title fs-4">Transportation</span>
        </div>
        <div class="ds-row">
          <span class="ds-icon-avatar ds-tint-lavender"><i class="bi bi-bag"></i></span>
          <span class="ds-row-title fs-4">Shopping</span>
        </div>
        <div class="ds-row">
          <span class="ds-icon-avatar ds-tint-lavender"><i class="bi bi-mortarboard"></i></span>
          <span class="ds-row-title fs-4">Education</span>
        </div>
        <div class="ds-row">
          <span class="ds-icon-avatar ds-tint-lavender"><i class="bi bi-heart-pulse"></i></span>
          <span class="ds-row-title fs-4">Health</span>
        </div>
        <div class="ds-row">
          <span class="ds-icon-avatar ds-tint-lavender"><i class="bi bi-film"></i></span>
          <span class="ds-row-title fs-4">Entertainment</span>
        </div>
        <div class="ds-row">
          <span class="ds-icon-avatar ds-tint-lavender"><i class="bi bi-receipt"></i></span>
          <span class="ds-row-title fs-4">Bills</span>
        </div>
        <div class="ds-row">
          <span class="ds-icon-avatar ds-tint-lavender"><i class="bi bi-people"></i></span>
          <span class="ds-row-title fs-4">Family</span>
        </div>
        <div class="ds-row">
          <span class="ds-icon-avatar ds-tint-lavender"><i class="bi bi-airplane"></i></span>
          <span class="ds-row-title fs-4">Travel</span>
        </div>
      </section>
    </div>

    <div class="ds-footer-cta" style="padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));">
      <button type="button" class="btn ds-btn-primary w-100 shadow" style="box-shadow: var(--ds-shadow-raised) !important;">
        <i class="bi bi-plus-lg me-2"></i> Add Category
      </button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
